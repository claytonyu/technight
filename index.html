<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNA to Protein Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
:root{--tabh:40px;--ink:#17302f;--paper:#e9f0ec;--panel:#fff;--line:#cfdcd5;--brand:#0f766e;--ok:#15803d;--bad:#b91c1c;--mute:#5b6f6b;--a:#16a34a;--c:#2563eb;--g:#d97706;--t:#dc2626}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Nunito,system-ui,sans-serif;background:var(--paper);color:var(--ink);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:22px;padding:10px 18px;background:var(--ink);color:#fff;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-size:1.2rem;font-weight:800}
.bases{display:flex;gap:3px}
.bases i{width:22px;height:22px;border-radius:6px;font:800 .8rem/22px Nunito,sans-serif;text-align:center;font-style:normal;color:#fff}
.left,.right{display:flex;flex-direction:column;min-height:0;min-width:0}
.right .col{margin-top:var(--tabh)}
.left .col{border-top-left-radius:0}
.tabs{display:flex;gap:4px;align-items:flex-end;height:var(--tabh);padding-left:8px;flex:none}
.tab{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;height:34px;padding:0 11px;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:#d3e0d9;color:#3d5753;font:700 .85rem Nunito,sans-serif;cursor:pointer}
.tab:hover{background:#e0ebe6}
.tab.on{height:var(--tabh);margin-bottom:-1px;position:relative;z-index:2;background:var(--panel);color:var(--ink)}
.tab:focus-visible,button:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}
#status{margin-left:auto;font-size:.88rem;color:#b6cfc8}
main{flex:1;min-height:0}
.pane{display:none;height:100%;grid-template-columns:1fr 1fr;gap:14px;padding:14px}
.pane.on{display:grid}
.col{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bar{display:flex;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-weight:800}
.bar span{flex:1}
.b{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:7px 14px;font:700 .9rem Nunito,sans-serif;cursor:pointer}
.b:hover{border-color:var(--brand)}
.go{background:var(--ok);border-color:var(--ok);color:#fff;font-size:1rem}
.go:hover{background:#166534;border-color:#166534}
.b:disabled{opacity:.5;cursor:default}
.ed{flex:1;min-height:0}
.ed textarea{width:100%;height:100%;border:0;padding:10px;resize:none;font:15px/1.5 ui-monospace,Menlo,Consolas,monospace}
.CodeMirror{height:100%;font:15px/1.5 ui-monospace,Menlo,Consolas,monospace}
.res{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.intro{border-left:5px solid var(--brand);background:#f0f7f5;padding:9px 12px;line-height:1.45}
pre.out{margin:0;background:#102322;color:#e6f2ee;border-radius:9px;padding:12px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;min-height:72px}
.err{color:#fecaca}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{padding:8px 10px;border-radius:8px;border:1px solid var(--line)}
.checks li.ok{background:#ecf8ef;border-color:#a7d8b4}
.checks li.no{background:#fdf0ef;border-color:#f0b6b1}
.checks small{display:block;margin-top:3px;color:var(--mute);font:13px ui-monospace,Menlo,monospace;word-break:break-all}
.win{background:#fde68a;border-radius:9px;padding:10px 12px;font-weight:800}
details{line-height:1.4}
summary{cursor:pointer;font-weight:700}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:3px 8px;font:13px ui-monospace,Menlo,monospace;margin-top:8px}
@media(max-width:800px){.pane.on{grid-template-columns:1fr;overflow:auto}.col{min-height:70vh}.right .col{margin-top:0}}
</style>
</head>
<body>
<header>
  <div class="logo">
    <span class="bases"><i style="background:var(--a)">A</i><i style="background:var(--c)">C</i><i style="background:var(--g)">G</i><i style="background:var(--t)">T</i></span>
    DNA to Protein Lab
  </div>
  <div id="status">Loading Python (about 10 seconds the first time)...</div>
</header>
<main id="main"></main>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script>
const AA = "FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG";

// Hidden Python: codon table, helper, and the checker. Students never see this.
const BASE = `
import itertools, json, io, contextlib
CODON_TABLE = {"".join(c): a for c, a in zip(itertools.product("UCAG", repeat=3), "${AA}")}
def split_into_codons(rna):
    return [rna[i:i+3] for i in range(0, len(rna) - 2, 3)]
def _chk(raw):
    out = []
    for label, fn, given, want, mode in json.loads(raw):
        if fn not in globals():
            got = "(no function called " + fn + " yet)"
        else:
            try:
                if mode == "out":
                    buf = io.StringIO()
                    with contextlib.redirect_stdout(buf):
                        globals()[fn](given)
                    got = buf.getvalue()
                else:
                    got = globals()[fn](given)
            except Exception as e:
                got = "error: " + str(e)
        out.append([label, got == want, given, want, got if isinstance(got, str) else repr(got)])
    return json.dumps(out)
`;

const TABS = [
{
  id: "p0", name: "Part 0: Loops",
  intro: "<b>Warm-up.</b> Four short tasks, in order. Read the comments, fix or fill in the code, then press Run. Python stops at the first problem it finds, so start with Task 1.",
  code: `# TASK 1
# Run this code. Python will complain. Fix it so it prints GATTACA.

print(GATTACA)


# TASK 2
# Make rna longer: add a "U" to the end of it, then add a "C".

rna = "AUG"
# YOUR CODE HERE
print(rna)


# TASK 3
# Print each letter of the DNA, one letter per line.

dna = "GATTACA"
for letter in dna:
    pass # Delete this line and put your code HERE


# TASK 4
# This loop prints each letter. Change it so that after printing a T,
# it also prints: Found a T!

dna = "ACTTGA"
for letter in dna:
    print(letter)
    # YOUR CODE HERE
`,
  checks: [
    { label: "Task 1: prints GATTACA", line: "GATTACA" },
    { label: "Task 2: rna grows to AUGUC", line: "AUGUC", v: ["rna", "AUGUC"] },
    { label: "Task 3: prints each letter on its own line", seq: ["G","A","T","T","A","C","A"] },
    { label: "Task 4: says Found a T! after each T", seq: ["A","C","T","Found a T!","T","Found a T!","G","A"] }
  ],
  win: "Part 0 complete! You can now read DNA one letter at a time."
},
{
  id: "p1", name: "Part 1: DNA to RNA", fn: "dna_to_rna",
  intro: "<b>Transcription.</b> Cells copy DNA into RNA. Each DNA letter gets a partner letter in the RNA: <b>A</b> pairs with <b>U</b>, <b>T</b> with <b>A</b>, <b>C</b> with <b>G</b>, and <b>G</b> with <b>C</b>. Fill in the spot marked YOUR CODE HERE, then press Run.",
  code: `# PART 1: DNA to RNA
# Each DNA letter gets a partner letter in the RNA:
#   A pairs with U
#   T pairs with A
#   C pairs with G
#   G pairs with C
# Example: DNA "GATTACA" becomes RNA "CUAAUGU"

def dna_to_rna(dna):
    rna = ""                 # an empty box that we will fill up

    for letter in dna:       # look at one letter at a time
        # YOUR CODE HERE
        # Step 1: find the partner of this letter (see the list above)
        # Step 2: add the partner to the end of rna
        pass

    return rna


# Try it out! Change the DNA and press Run.
print(dna_to_rna("GATTACA"))
`,
  cases: [["A gets a U","A","U"],["T gets an A","T","A"],["C gets a G","C","G"],["G gets a C","G","C"],["a mix","ATGC","UACG"],["GATTACA","GATTACA","CUAAUGU"],["a longer strand","TTTAAACCCGGG","AAAUUUGGGCCC"]],
  win: "Part 1 complete! You just did what a cell does every second.",
},
{
  id: "p2", name: "Part 2: RNA to protein", fn: "rna_to_protein", book: true,
  intro: "<b>Translation.</b> Cells read RNA three letters at a time. Each group of three (a <b>codon</b>) is one amino acid, and some codons mean STOP. Open the codon book below if you want to look codons up.",
  code: `# PART 2: RNA to protein
# Cells read RNA three letters at a time.
# Each group of three (a "codon") means one amino acid.
# Some codons mean STOP.
#
# These two helpers are already loaded for you:
#   CODON_TABLE["AUG"]             gives "M"  (a "*" means STOP)
#   split_into_codons("AUGGCU")    gives ["AUG", "GCU"]

def rna_to_protein(rna):
    protein = ""                          # start with an empty protein
    codons = split_into_codons(rna)

    for codon in codons:                  # look at one codon at a time
        # YOUR CODE HERE
        # Step 1: look up the codon in CODON_TABLE
        # Step 2: if the amino acid is "*", stop the loop with: break
        # Step 3: otherwise, add the amino acid to the end of protein
        pass

    return protein


# Try it out! Change the RNA and press Run.
print(rna_to_protein("AUGGCUAAA"))
`,
  cases: [["the START codon","AUG","M"],["three codons","AUGGCUAAA","MAK"],["stops at a STOP codon","AUGUAAGCU","M"],["leftover letters are ignored","AUGGC","M"],["a longer one","UCUUGUAUUGAAAAUUGUGAAUAA","SCIENCE"]],
  win: "Part 2 complete! You just built a protein.",
},
{
  id: "bonus", name: "Bonus: secrets", fn: "dna_to_protein", book: true, needs: [1, 2],
  intro: "<b>Bonus.</b> Join your two functions to go from DNA all the way to protein. Each secret DNA string codes for a protein whose letters spell a word. Your code from Parts 1 and 2 is loaded automatically.",
  code: `# BONUS: secret messages
# Your dna_to_rna and rna_to_protein functions are already loaded.
# Each DNA string below codes for a protein that spells a word!

def dna_to_protein(dna):
    # YOUR CODE HERE
    # Turn the DNA into RNA first, then turn the RNA into protein.
    pass


for message in ["CTATTACGTATT", "ACACTTGAAGAAATC", "GAATAAAAACTTACT", "AGAACATAACTTTTAACACTTATT"]:
    print(message, "codes for", dna_to_protein(message))
`,
  cases: [["DNA all the way to protein","TACCGATTT","MAK"],["secret message 1","CTATTACGTATT","DNA"],["secret message 2","ACACTTGAAGAAATC","CELL"],["secret message 3","GAATAAAAACTTACT","LIFE"],["secret message 4","AGAACATAACTTTTAACACTTATT","SCIENCE"]],
  win: "You decoded every secret message!",
}];

let py = null;
const $ = (s, r = document) => r.querySelector(s);
const CODONS = [];
for (const a of "UCAG") for (const b of "UCAG") for (const c of "UCAG") CODONS.push(a + b + c);
const BOOK = `<details><summary>Codon book (* means STOP)</summary><div class="book">${CODONS.map((c, i) => `<span>${c} = <b>${AA[i]}</b></span>`).join("")}</div></details>`;

TABS.forEach((t, i) => {
  const pane = document.createElement("section");
  pane.className = "pane";
  const tabs = TABS.map((x, j) => `<button class="tab${j === i ? " on" : ""}" data-i="${j}" title="${x.name}">${x.name}</button>`).join("");
  pane.innerHTML = `
    <div class="left"><div class="tabs">${tabs}</div>
      <div class="col"><div class="bar"><span>Your code</span>
        <button class="b" data-a="reset">Start over</button>
        <button class="b go" data-a="run" disabled>Run</button></div>
        <div class="ed"><textarea></textarea></div></div></div>
    <div class="right"><div class="col"><div class="bar"><span>Results</span></div>
      <div class="res"><div class="intro">${t.intro}</div>
        <pre class="out">Press Run to see what happens.</pre>
        <ul class="checks"></ul><div class="win" hidden></div>
        ${t.book ? BOOK : ""}</div></div></div>`;
  $("#main").append(pane); t.pane = pane;
  pane.querySelectorAll(".tab").forEach(b => (b.onclick = () => show(+b.dataset.i)));

  const ta = $("textarea", pane); ta.value = t.code;
  if (window.CodeMirror) {
    const cm = CodeMirror.fromTextArea(ta, {
      mode: "python", lineNumbers: true, indentUnit: 4, matchBrackets: true,
      extraKeys: {
        Tab: c => c.somethingSelected() ? c.indentSelection("add") : c.replaceSelection("    ", "end"),
        "Shift-Tab": "indentLess",
        "Ctrl-Enter": () => run(t), "Cmd-Enter": () => run(t)
      }
    });
    t.ed = { get: () => cm.getValue(), set: v => cm.setValue(v), refresh: () => cm.refresh(), onChange: f => cm.on("change", f) };
  } else {
    t.ed = { get: () => ta.value, set: v => (ta.value = v), refresh() {}, onChange: f => ta.addEventListener("input", f) };
  }

  t.ui = { go: $("[data-a=run]", pane), out: $(".out", pane), checks: $(".checks", pane), win: $(".win", pane) };
  t.ui.go.onclick = () => run(t);
  $("[data-a=reset]", pane).onclick = () => { if (confirm("Start over with the original code? Your changes will be lost.")) t.ed.set(t.code); };

  // Keep the student's code in this browser so a refresh does not lose it.
  const KEY = "dnaLab.v1.code." + t.id;
  try { const saved = localStorage.getItem(KEY); if (saved !== null) t.ed.set(saved); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, t.ed.get()); } catch (e) {} };
  let timer;
  t.ed.onChange(() => { clearTimeout(timer); timer = setTimeout(save, 300); });
  window.addEventListener("pagehide", save);
});

function show(i) {
  TABS.forEach((t, j) => t.pane.classList.toggle("on", i === j));
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", +b.dataset.i === i));
  TABS[i].ed.refresh();
}
show(0);

const hasSeq = (lines, seq) => lines.some((_, i) => seq.every((s, j) => lines[i + j] === s));
const fmt = v => JSON.stringify(v).replace(/\\n/g, " / ");

function tip(line) {
  if (/IndentationError/.test(line)) return "Tip: check the spaces at the start of your lines.";
  if (/SyntaxError/.test(line)) return "Tip: look for a missing colon :  or a missing quote or bracket.";
  if (/NameError/.test(line)) return "Tip: Python does not know that name. If it should be text, put it in quotes. If it is a name you made, check the spelling.";
  if (/TypeError/.test(line)) return "Tip: something does not fit together. Check what you are adding or calling.";
  return "";
}

function showErr(u, e, pre) {
  const msg = String(e.message || e).trim(), lines = msg.split("\n"), last = lines[lines.length - 1];
  const m = [...msg.matchAll(/File "<exec>", line (\d+)/g)], ln = m.length ? m[m.length - 1][1] : null;
  const s = document.createElement("span"); s.className = "err";
  s.textContent = (pre ? pre + "\n" : "") + "Python stopped" + (ln ? " at line " + ln : "") + ":\n" + last + "\n" + tip(last);
  u.out.append(s);
}

async function run(t) {
  if (!py) return;
  const u = t.ui;
  u.go.disabled = true; u.checks.innerHTML = ""; u.win.hidden = true; u.out.textContent = "";
  await new Promise(r => setTimeout(r, 30));
  let buf = []; const sink = s => buf.push(s);
  py.setStdout({ batched: sink }); py.setStderr({ batched: sink });
  const ns = py.runPython("dict()");
  try {
    py.runPython(BASE, { globals: ns });
    for (const j of t.needs || []) {
      try { py.runPython(TABS[j].ed.get(), { globals: ns }); }
      catch (e) { showErr(u, e, "Your code in \"" + TABS[j].name + "\" has a problem. Go back and fix it first."); return; }
    }
    buf = [];
    try { py.runPython(t.ed.get(), { globals: ns }); }
    catch (e) { u.out.textContent = buf.length ? buf.join("\n") + "\n\n" : ""; showErr(u, e); return; }
    u.out.textContent = buf.join("\n") || "(Your code ran but printed nothing. Add a print line to see something!)";
    let res;
    if (t.checks) {
      const lines = buf.map(s => s.trimEnd());
      res = t.checks.map(c => {
        const ok = (c.seq ? hasSeq(lines, c.seq) : lines.includes(c.line)) && (!c.v || ns.get(c.v[0]) === c.v[1]);
        return { label: c.label, ok, note: "we wanted your program to print " + (c.seq ? c.seq.join(" / ") : c.line) + ". It printed: " + (lines.slice(0, 14).join(" / ") || "nothing") };
      });
    } else {
      const chk = ns.get("_chk");
      res = JSON.parse(chk(JSON.stringify(t.cases.map(c => [c[0], c[3] || t.fn, c[1], c[2], c[4] || "ret"]))))
        .map(([label, ok, given, want, got]) => ({ label, ok, note: "we gave it " + fmt(given) + ", we wanted " + fmt(want) + ", you gave us " + fmt(got) }));
      chk.destroy();
    }
    let all = true;
    for (const r of res) {
      all = all && r.ok;
      const li = document.createElement("li"); li.className = r.ok ? "ok" : "no";
      li.textContent = (r.ok ? "Passed: " : "Not yet: ") + r.label;
      if (!r.ok) { const s = document.createElement("small"); s.textContent = r.note; li.append(s); }
      u.checks.append(li);
    }
    if (all) { u.win.textContent = t.win; u.win.hidden = false; }
  } finally {
    ns.destroy(); u.go.disabled = false;
  }
}

(async () => {
  try {
    py = await loadPyodide();
    $("#status").textContent = "Python is ready";
    TABS.forEach(t => (t.ui.go.disabled = false));
  } catch (e) {
    $("#status").textContent = "Could not load Python. Check your internet connection and reload.";
  }
})();
</script>
</body>
</html>
